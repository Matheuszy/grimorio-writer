<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Grimório</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">O Grimório Errante</h1>
<div class="subtitle">estenda o indicador para escrever &middot; abra a mão e deslize para virar a página &middot; feche o punho para apagar</div>

<div class="stage">
  <div class="cover-frame"></div>
  <div class="spine"></div>

  <div class="page-stack" id="pageStack"></div>

  <div class="scrying-glass" id="scryingGlass">
    <div class="idle-text" id="camIdleText">aguardando<br>visão...</div>
    <img id="camFeed" alt="câmera">
  </div>
  <div class="pen-indicator" id="penIndicator" title="modo caneta"></div>
</div>

<div class="footer">
  <div><span class="status-dot" id="statusDot"></span><span id="statusText">Sem conexão com o backend Python</span></div>
  <div class="hint">teste sem câmera: arraste o mouse na página para escrever &middot; setas ← → para virar página &middot; C para limpar a página</div>
</div>

<script src="js/book.js"></script>
<script src="js/drawing.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/connection.js"></script>
<script src="js/main.js"></script>
</body>
</html>

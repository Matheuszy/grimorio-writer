<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Grimório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:      #120d0a;
    --leather:      #2b1c12;
    --leather-dark: #180f09;
    --parchment:    #e8d9b0;
    --parchment-2:  #ddc99a;
    --gold:         #a8752f;
    --gold-bright:  #d9a54a;
    --ink-glow:     #d98f3f;
    --crease:       #5a4632;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%; margin:0;
    background: radial-gradient(ellipse at 50% 40%, #241811 0%, var(--bg-void) 70%);
    font-family:'EB Garamond', serif;
    overflow:hidden;
    color: var(--parchment);
  }

  /* leve flicker de vela no ambiente */
  body::before{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(ellipse at 50% 35%, rgba(217,143,63,0.08), transparent 60%);
    animation: flicker 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes flicker{
    0%,100%{ opacity:.9; }
    45%{ opacity:1; }
    50%{ opacity:.75; }
    78%{ opacity:.95; }
  }

  h1.title{
    font-family:'UnifrakturCook', cursive;
    text-align:center;
    color: var(--gold-bright);
    font-size: 2.1rem;
    letter-spacing: 1px;
    margin: 22px 0 4px;
    text-shadow: 0 0 18px rgba(217,143,63,.45);
  }

  .subtitle{
    text-align:center;
    font-style: italic;
    color: var(--parchment-2);
    opacity:.65;
    font-size: .95rem;
    margin-bottom: 18px;
  }

  /* ---------------- Livro ---------------- */

  .stage{
    position:relative;
    width: 720px;
    height: 480px;
    margin: 0 auto;
    perspective: 2400px;
  }

  .cover-frame{
    position:absolute; inset:-18px;
    background: linear-gradient(160deg, var(--leather) 0%, var(--leather-dark) 100%);
    border-radius: 10px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.65),
      inset 0 0 0 2px rgba(168,117,47,.35),
      inset 0 0 40px rgba(0,0,0,.6);
  }
  .cover-frame::after{
    content:"";
    position:absolute; inset:10px;
    border: 1px solid rgba(168,117,47,.25);
    border-radius: 6px;
  }

  .spine{
    position:absolute; left:50%; top:-18px; bottom:-18px;
    width: 14px; margin-left:-7px;
    background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.1) 40%, rgba(0,0,0,.1) 60%, rgba(0,0,0,.55));
    z-index: 5;
  }

  .page-stack{
    position:absolute; inset:0;
    transform-style: preserve-3d;
  }

  .page{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.05), transparent 40%),
      linear-gradient(135deg, var(--parchment) 0%, var(--parchment-2) 100%);
    border-radius: 3px;
    box-shadow: inset 0 0 30px rgba(90,70,50,.35), inset 0 0 3px rgba(0,0,0,.4);
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform .85s cubic-bezier(.4,.1,.2,1);
    backface-visibility: hidden;
  }
  .page::before{ /* vinco central */
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:24px;
    background: linear-gradient(90deg, rgba(0,0,0,.25), transparent);
  }
  .page.flipped{
    transform: rotateY(-178deg);
    box-shadow: 8px 0 30px rgba(0,0,0,.5), inset 0 0 30px rgba(90,70,50,.35);
  }

  .page-number{
    position:absolute; bottom:14px; right:22px;
    font-style: italic; color: var(--crease); opacity:.55; font-size:.85rem;
  }

  .page canvas{
    position:absolute; inset:0; width:100%; height:100%;
    cursor: crosshair;
  }

  /* --------------- Espelho de escrutínio (câmera) --------------- */

  .scrying-glass{
    position:absolute; top:-64px; right:-64px;
    width:132px; height:132px;
    border-radius:50%;
    background: #000;
    border: 6px solid var(--gold);
    box-shadow:
      0 0 0 2px var(--leather-dark),
      0 0 24px rgba(217,143,63,.5),
      inset 0 0 20px rgba(0,0,0,.8);
    overflow:hidden;
    z-index: 20;
  }
  .scrying-glass img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    filter: sepia(.35) contrast(1.05) saturate(1.1);
    transform: scaleX(-1); /* espelha visualmente, mesma orientação do frontend */
    opacity:0;
    transition: opacity .4s;
  }
  .scrying-glass img.live{ opacity:1; }
  .scrying-glass .idle-text{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:.68rem; padding:10px;
    color: var(--gold-bright); opacity:.8; font-style:italic;
  }

  .pen-indicator{
    position:absolute; top:74px; right:-46px;
    width:14px; height:14px; border-radius:50%;
    background: var(--crease);
    box-shadow: 0 0 0 3px rgba(0,0,0,.3);
    z-index:21;
    transition: background .2s, box-shadow .2s;
  }
  .pen-indicator.active{
    background: var(--ink-glow);
    box-shadow: 0 0 12px 4px rgba(217,143,63,.8);
  }

  /* --------------- Rodapé / status --------------- */

  .footer{
    position:fixed; left:0; right:0; bottom:18px;
    text-align:center; font-size:.85rem; color: var(--parchment-2);
    opacity:.7;
  }
  .status-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#8a3b3b; margin-right:6px; vertical-align:middle;
  }
  .status-dot.on{ background:#5fae6a; box-shadow:0 0 8px #5fae6a; }

  .hint{ margin-top:4px; opacity:.55; font-style:italic; }
</style>
</head>
<body>

  <h1 class="title">O Grimório Errante</h1>
  <div class="subtitle">estenda o indicador para escrever &middot; abra a mão e deslize para virar a página</div>

  <div class="stage">
    <div class="cover-frame"></div>
    <div class="spine"></div>

    <div class="page-stack" id="pageStack"></div>

    <div class="scrying-glass" id="scryingGlass">
      <div class="idle-text" id="camIdleText">aguardando<br>visão...</div>
      <img id="camFeed" alt="câmera">
    </div>
    <div class="pen-indicator" id="penIndicator" title="modo caneta"></div>
  </div>

  <div class="footer">
    <div><span class="status-dot" id="statusDot"></span><span id="statusText">Sem conexão com o backend Python</span></div>
    <div class="hint">teste sem câmera: arraste o mouse na página para escrever &middot; setas ← → para virar página &middot; C para limpar a página</div>
  </div>

<script>
const TOTAL_PAGES = 5;
const stack = document.getElementById('pageStack');
const pages = [];        // { el, canvas, ctx }
let currentIndex = 0;

for (let i = 0; i < TOTAL_PAGES; i++) {
  const pageEl = document.createElement('div');
  pageEl.className = 'page';
  pageEl.style.zIndex = TOTAL_PAGES - i;

  const canvas = document.createElement('canvas');
  canvas.width = 720; canvas.height = 480;
  pageEl.appendChild(canvas);

  const pn = document.createElement('div');
  pn.className = 'page-number';
  pn.textContent = 'fólio ' + (i + 1);
  pageEl.appendChild(pn);

  stack.appendChild(pageEl);
  pages.push({ el: pageEl, canvas, ctx: canvas.getContext('2d') });
}

function goToPage(newIndex) {
  if (newIndex < 0 || newIndex >= TOTAL_PAGES || newIndex === currentIndex) return;

  if (newIndex > currentIndex) {
    pages[currentIndex].el.classList.add('flipped');
  } else {
    pages[newIndex].el.classList.remove('flipped');
  }
  currentIndex = newIndex;
}

// -------- desenho (tinta mágica com brilho) --------
let drawing = false;
let lastPoint = null;

function inkStroke(ctx, from, to) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.shadowColor = 'rgba(217,143,63,0.85)';
  ctx.shadowBlur = 10;
  ctx.strokeStyle = 'rgba(90,55,20,0.9)';
  ctx.lineWidth = 2.6;

  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
  ctx.restore();
}

function drawAt(normX, normY) {
  const page = pages[currentIndex];
  const x = normX * page.canvas.width;
  const y = normY * page.canvas.height;
  if (lastPoint) {
    inkStroke(page.ctx, lastPoint, { x, y });
  }
  lastPoint = { x, y };
}

function releasePen() { lastPoint = null; }

// teste manual com o mouse (sem precisar do Python rodando)
pages.forEach((p, idx) => {
  p.canvas.addEventListener('mousedown', e => {
    if (idx !== currentIndex) return;
    drawing = true;
    const r = p.canvas.getBoundingClientRect();
    drawAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  });
  p.canvas.addEventListener('mousemove', e => {
    if (!drawing || idx !== currentIndex) return;
    const r = p.canvas.getBoundingClientRect();
    drawAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  });
});
window.addEventListener('mouseup', () => { drawing = false; releasePen(); });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goToPage(currentIndex + 1);
  if (e.key === 'ArrowLeft') goToPage(currentIndex - 1);
  if (e.key.toLowerCase() === 'c') {
    const p = pages[currentIndex];
    p.ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
  }
});

// -------------- conexão com o backend Python --------------
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const camFeed = document.getElementById('camFeed');
const camIdleText = document.getElementById('camIdleText');
const penIndicator = document.getElementById('penIndicator');

function connect() {
  const ws = new WebSocket('ws://localhost:8765');

  ws.onopen = () => {
    statusDot.classList.add('on');
    statusText.textContent = 'Conectado ao grimório — comece a escrever';
  };

  ws.onclose = () => {
    statusDot.classList.remove('on');
    statusText.textContent = 'Sem conexão com o backend Python — reconectando...';
    camFeed.classList.remove('live');
    camIdleText.style.display = 'flex';
    setTimeout(connect, 1500);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === 'update') {
      if (msg.frame) {
        camFeed.src = 'data:image/jpeg;base64,' + msg.frame;
        camFeed.classList.add('live');
        camIdleText.style.display = 'none';
      }
      penIndicator.classList.toggle('active', !!msg.pen_mode);

      if (msg.pen_mode && msg.fingertip) {
        drawAt(msg.fingertip.x, msg.fingertip.y);
      } else {
        releasePen();
      }
    }

    if (msg.type === 'gesture') {
      if (msg.action === 'next_page') goToPage(currentIndex + 1);
      if (msg.action === 'prev_page') goToPage(currentIndex - 1);
    }
  };
}
connect();
</script>
</body>
</html>
